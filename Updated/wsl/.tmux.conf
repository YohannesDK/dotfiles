# remap prefix to Control + b
set -g prefix C-b
bind C-b send-prefix

set -g base-index 1

# Window title managed by shell hooks (see .zshrc)
set-window-option -g automatic-rename off
set-option -g set-titles on

# Manual rename: marks window so auto-rename won't overwrite until next cd
bind-key , command-prompt -I "#W" "rename-window '%%'; set-window-option @manual_rename 1"

set -g status-keys vi
set -g history-limit 10000
setw -g mode-keys vi
setw -g mouse on
setw -g monitor-activity on

# New window / kill
bind-key -n C-n new-window
bind-key -n C-w kill-window
bind-key v split-window -h
bind-key s split-window -v

# Resizing
bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

# Alt-vim to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Ctrl-arrow to switch windows
bind -n C-h previous-window
bind -n C-l next-window

# True Color
set-option -g default-terminal "screen-256color"
set -sg escape-time 0

set -g default-shell /bin/zsh

# Reload config
bind r source-file ~/.tmux.conf \; display-message " Config reloaded!"

# ─── THEME ────────────────────────────────────────────────────────────────────

set -g status-style          "bg=default"
set -g status-interval       5
set -g status-justify        centre

# Left: session name + user
set -g status-left-length    40
set -g status-left           '#[fg=colour39,bold] #S #[fg=colour245]│ #[fg=colour252]#(whoami) '

# Right: load + time
set -g status-right-length   50
set -g status-right          '#[fg=colour245]#(cut -d " " -f 1-3 /proc/loadavg) #[fg=colour239]│ #[fg=colour252]%H:%M #[fg=colour239]│ #[fg=colour39]%d %b'

# ─── WINDOWS ──────────────────────────────────────────────────────────────────

# Inactive windows — subtle
set -g window-status-format          ' #I #W '
set -g window-status-style           'fg=colour245,bg=default'

# Active window — boxed with bright accent
set -g window-status-current-format  '┃ #I #W#{?window_zoomed_flag, ⬡,} ┃'
set -g window-status-current-style   'fg=colour39,bg=default,bold'

# Activity alert
set -g window-status-activity-style  'fg=colour208,bg=default'

# ─── PANES ────────────────────────────────────────────────────────────────────

set -g pane-border-style             'fg=colour239'
set -g pane-active-border-style      'fg=colour39'

set -g display-panes-colour          colour245
set -g display-panes-active-colour   colour39

# ─── MESSAGES ─────────────────────────────────────────────────────────────────

set -g message-style                 'fg=colour39,bg=default,bold'

# Split panes (was s/v, moved to match intuition)
bind-key v split-window -h
bind-key h split-window -v          # was 's', now 'h' for horizontal split

# Session switching
bind-key -r Left  switch-client -p
bind-key -r Right switch-client -n

# Interactive session tree
bind-key i choose-tree -Zs

# pane focus and kill
bind-key -n C-f resize-pane -Z
bind-key -n C-x kill-pane

