format = """
$directory\
$git_branch\
$git_status\
$fill\
$python\
$lua\
$nodejs\
$golang\
$haskell\
$rust\
$ruby\
$package\
$aws\
$docker_context\
$jobs\
$cmd_duration\
$line_break\
$character"""

add_newline = true
palette = 'nord'

[directory]
style = 'bold fg:dark_blue'
format = '[$path ]($style)'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false

[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '

[git_branch]
style = 'fg:green'
symbol = ' '
format = '[on](white) [$symbol$branch ]($style)'

[git_status]
format = "⧉ $all_status$ahead_behind"

# Relationship to remote
ahead     = "[↑${count} ](fg:blue)"
behind    = "[↓${count} ](fg:blue)"
diverged  = "[↕ ↑${ahead_count} ↓${behind_count} ](fg:blue)"

# File states (clean icon-like symbols)
staged     = "[✚${count} ](fg:green)"      # clean 'added' symbol
modified   = "[✎${count} ](fg:yellow)"     # clean pencil
untracked  = "[…${count} ](fg:gray)"       # ellipsis = unknown/new
stashed    = "[ ▣..${count} ](fg:purple)"     # your symbol — perfect
renamed    = "[➜${count} ](fg:cyan)"       # clear directional rename
deleted    = "[✖${count} ](fg:red)"        # sharp delete/cross
conflicted = "[‼${count} ](fg:red)"        # merge conflict

[fill]
symbol = ' '

[python]
style = 'teal'
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
pyenv_version_name = true
pyenv_prefix = ''

[lua]
symbol = ' '

[nodejs]
style = 'blue'
symbol = ' '

[golang]
style = 'blue'
symbol = ' '

[haskell]
style = 'blue'
symbol = ' '

[rust]
style = 'orange'
symbol = ' '

[ruby]
style = 'blue'
symbol = ' '

[package]
symbol = '󰏗 '

[aws]
symbol = ' '
style = 'yellow'
format = '[$symbol($profile )(\[$duration\] )]($style)'

[docker_context]
symbol = ' '
style = 'fg:#06969A'
format = '[$symbol]($style) $path'
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = ['Dockerfile']

[jobs]
symbol = ' '
style = 'red'
number_threshold = 1
format = '[$symbol]($style)'

[cmd_duration]
min_time = 500
style = 'fg:gray'
format = '[$duration]($style)'

[palettes.nord]
dark_blue = '#5E81AC'
blue = '#81A1C1'
teal = '#88C0D0'
red = '#BF616A'
orange = '#D08770'
green = '#A3BE8C'
yellow = '#EBCB8B'
purple = '#B48EAD'
gray = '#434C5E'
black = '#2E3440'
white='#D8DEE9'

[palettes.onedark]
dark_blue='#61afef'
blue='#56b6c2'
red='#e06c75'
green='#98c379'
purple='#c678dd'
cyan='#56b6c2'
orange='#be5046'
yellow='#e5c07b'
gray='#828997'
white ='#abb2bf'
black='#2c323c'

[palettes.solarized_light]
dark_blue = '#268bd2'  # blue
blue      = '#268bd2'  # blue
teal      = '#2aa198'  # cyan
red       = '#dc322f'  # red
orange    = '#cb4b16'  # orange
green     = '#859900'  # green
yellow    = '#b58900'  # yellow
purple    = '#6c71c4'  # violet
cyan      = '#2aa198'  # cyan
gray      = '#93a1a1'  # base1 (light gray, still readable on cream bg)
black     = '#073642'  # base02
white     = '#657b83'  # base00 — used as *foreground*, so kept dark for light bg
